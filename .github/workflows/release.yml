name: Release

# Releases the honcho plugin. Source carries no release version: the version
# is a dispatch input, stamped into the staged plugin.json and package.json
# at build time, so a release never commits anything to main. The registry
# and the GitHub Releases page are the record of what is published.
#
# Publishing is staged: this workflow stages the version on npm through
# trusted publishing (OIDC, no stored token), and a maintainer approves it with
# 2FA on npmjs.com or with `npm stage approve`. The GitHub Release is created as
# a draft; publish it after approving on npm, which creates the tag and runs
# release-branch.yml to mirror the approved package onto release/honcho.
#
# Re-dispatching a version that is already on npm skips staging and only
# fills in a missing draft release.
#
# The npm dist-tag is derived from the version: prerelease versions stage
# under next, stable versions under latest.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.0 or 0.3.0-rc.1)"
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    # Dispatch runs the workflow definition from the selected ref; only the
    # reviewed copy on main may stage a release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Matches the environment on the npm trusted publisher config, and limits
    # OIDC tokens to deployments from main.
    environment: npm
    permissions:
      contents: write # draft GitHub Release
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: plugins/honcho
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # No dependency cache: a release must not restore state that another
      # workflow run could have written.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # npm 12 needs node ^22.22.2; a range keeps an older cached 22.x off.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ^22.22.2
          registry-url: https://registry.npmjs.org

      # npm stage needs npm 11.15+. Pinned so a compromised npm release can't
      # reach the publish step.
      - run: npm install -g npm@12.2.0

      # npm's latest tag points at the most recently published version, not
      # the semver max, so a non-monotonic stable release would repoint
      # latest backwards. Prereleases are exempt (they stage under next).
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Whole-string match: [[ =~ ]] anchors reject embedded CR/LF, which
          # a line-based grep would let through into GITHUB_OUTPUT.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semver version"
            exit 1
          fi
          case "$VERSION" in
            *-*) DIST_TAG=next; PRERELEASE=true ;;
            *)   DIST_TAG=latest; PRERELEASE=false ;;
          esac
          # Equal versions pass through: re-dispatching a published version is
          # the retry path, and the later publish/release steps skip what
          # already exists. Lookups fail closed: only a confirmed E404 (no
          # package yet) counts as absence.
          set +e
          CURRENT_OUT="$(npm view @honcho-ai/claude-honcho dist-tags.latest 2>&1)"
          CURRENT_STATUS=$?
          set -e
          if [ "$CURRENT_STATUS" -eq 0 ]; then
            CURRENT="$CURRENT_OUT"
          elif echo "$CURRENT_OUT" | grep -q "E404"; then
            CURRENT=""
          else
            echo "::error::npm lookup for dist-tags.latest failed: $CURRENT_OUT"
            exit 1
          fi
          if [ "$DIST_TAG" = "latest" ] && [ -n "$CURRENT" ] && [ "$CURRENT" != "$VERSION" ]; then
            HIGHEST="$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)"
            if [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::$VERSION is lower than the published latest ($CURRENT)"
              exit 1
            fi
          fi
          {
            echo "version=$VERSION"
            echo "dist-tag=$DIST_TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release stage
        run: bun run scripts/build.ts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Validate staged plugin
        run: |
          # Pinned: every step in this job can mint the publish OIDC token.
          npm install -g @anthropic-ai/claude-code@2.1.291
          claude plugin validate .stage --strict

      - name: Smoke test bundled entry points
        run: bash scripts/smoke.sh .stage

      - name: Stage on npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: |
          # Fail closed: stage only on a confirmed E404 for this version.
          set +e
          EXISTS_OUT="$(npm view "@honcho-ai/claude-honcho@$VERSION" version 2>&1)"
          EXISTS_STATUS=$?
          set -e
          if [ "$EXISTS_STATUS" -eq 0 ] && [ -n "$EXISTS_OUT" ]; then
            echo "$VERSION already on npm; skipping stage"
          elif [ "$EXISTS_STATUS" -ne 0 ] && ! echo "$EXISTS_OUT" | grep -q "E404"; then
            echo "::error::npm lookup for $VERSION failed: $EXISTS_OUT"
            exit 1
          else
            npm stage publish .stage --provenance --access public --tag "$DIST_TAG"
            echo "::notice::Staged $VERSION. Approve it at https://www.npmjs.com/package/@honcho-ai/claude-honcho or with npm stage approve, then publish the draft release honcho-v$VERSION."
          fi

      # A draft release creates no tag until it is published, so a rejected
      # stage leaves nothing behind but the draft. --target pins the tag to
      # the exact commit that was staged. Publishing the draft triggers
      # release-branch.yml.
      - name: Draft GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="honcho-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG release already exists; skipping"
          else
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "honcho v$VERSION" \
              --generate-notes \
              $([ "$PRERELEASE" = "true" ] && echo --prerelease)
          fi
